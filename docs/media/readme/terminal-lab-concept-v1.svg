    </g>
    <g fill="#F2EEE6" font-size="12">
      <text x="392" y="467">source</text><text x="1048" y="467">observer</text>
    </g>
    <g fill="#58D6D0">
      <circle cx="544" cy="303" r="3"/><circle cx="674" cy="320" r="3"/><circle cx="816" cy="254" r="3"/><circle cx="948" cy="291" r="3"/>
    </g>

    <g font-size="14">
      <text x="1166" y="156" fill="#9EADB7">material</text><text x="1460" y="156" fill="#F2EEE6">DRY</text>
      <text x="1166" y="187" fill="#9EADB7">flow</text><text x="1460" y="187" fill="#F2EEE6">SUBSONIC PUFF</text>
      <text x="1166" y="218" fill="#9EADB7">wetness boundary</text><text x="1460" y="218" fill="#58D6D0">CLEAR</text>
      <text x="1166" y="249" fill="#9EADB7">choked criterion</text><text x="1460" y="249" fill="#58D6D0">CLEAR</text>
      <text x="1166" y="280" fill="#9EADB7">continuum Kn</text><text x="1460" y="280" fill="#F2EEE6">6.2e-6</text>
      <text x="1166" y="311" fill="#9EADB7">solver</text><text x="1460" y="311" fill="#F2EEE6">ANALYTICAL A</text>
      <text x="1166" y="342" fill="#9EADB7">step</text><text x="1460" y="342" fill="#F2EEE6">0.125 ms</text>
