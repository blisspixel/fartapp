      <rect x="1058" y="516" width="524" height="278" rx="4"/>
      <rect x="18" y="808" width="1564" height="74" rx="4"/>
    </g>

    <g font-size="16" font-weight="700" fill="#58D6D0">
      <text x="38" y="119">EMITTER + EXTERIOR</text>
      <text x="382" y="119">FIELD / PLUMEPRINT</text>
      <text x="1166" y="119">REGIME + SOLVER</text>
      <text x="38" y="547">OBSERVER ACOUSTICS</text>
      <text x="556" y="547">UNCERTAINTY BUDGET</text>
      <text x="1078" y="547">CONSERVATION OF ASS</text>
      <text x="38" y="839">EVENT TIMELINE</text>
    </g>

    <g font-size="14" fill="#9EADB7">
      <text x="38" y="156">ambient pressure</text><text x="248" y="156" text-anchor="end" fill="#F2EEE6">101.325 kPa</text>
      <text x="38" y="187">temperature</text><text x="248" y="187" text-anchor="end" fill="#F2EEE6">293.15 K</text>
      <text x="38" y="218">relative humidity</text><text x="248" y="218" text-anchor="end" fill="#F2EEE6">50.0 %</text>
      <text x="38" y="249">reservoir delta p</text><text x="248" y="249" text-anchor="end" fill="#F2EEE6">0.91 kPa</text>
      <text x="38" y="280">effective area</text><text x="248" y="280" text-anchor="end" fill="#F2EEE6">2.18 cm2</text>
      <text x="38" y="311">mass flow</text><text x="248" y="311" text-anchor="end" fill="#F2EEE6">0.173 g/s</text>
      <text x="38" y="342">source inventory</text><text x="248" y="342" text-anchor="end" fill="#F2EEE6">0.061 g</text>
      <text x="38" y="373">Mach / Reynolds</text><text x="248" y="373" text-anchor="end" fill="#E6B85C">0.004 / 1.7e3</text>
      <text x="38" y="404">recording</text><text x="248" y="404" text-anchor="end" fill="#F2EEE6">ephemeral</text>
      <text x="38" y="435">event nonce</text><text x="248" y="435" text-anchor="end" fill="#F2EEE6">committed</text>
