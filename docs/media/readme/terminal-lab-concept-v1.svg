<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Planned F.A.R.T. Lab terminal interface</title>
  <desc id="desc">An htop-style scientific terminal dashboard with live reference-event fields, solver status, uncertainty, acoustic plots, and conservation ledgers.</desc>
  <rect width="1600" height="900" fill="#0B0F12"/>
  <g font-family="Cascadia Mono, Consolas, monospace">
    <rect x="18" y="16" width="1564" height="58" rx="5" fill="#12191F" stroke="#58D6D0" stroke-opacity=".7"/>
    <text x="42" y="52" font-size="22" font-weight="700" fill="#F2EEE6">F.A.R.T. LAB</text>
    <text x="225" y="52" font-size="18" fill="#58D6D0">REFERENCE PFFT / LIVE INSTRUMENT</text>
    <text x="1015" y="52" font-size="16" fill="#F2EEE6">t  1.824 s</text>
    <text x="1165" y="52" font-size="16" fill="#E6B85C">D1 REPLAYABLE</text>
    <rect x="1350" y="27" width="202" height="36" rx="3" fill="#0B0F12" stroke="#E6B85C"/>
    <text x="1371" y="51" font-size="15" font-weight="700" fill="#F2EEE6">PLANNED CONCEPT</text>

    <g fill="#12191F" stroke="#34414A">
      <rect x="18" y="88" width="330" height="414" rx="4"/>
      <rect x="362" y="88" width="770" height="414" rx="4"/>
      <rect x="1146" y="88" width="436" height="414" rx="4"/>
