    <g stroke="#26343C"><path d="M43 584H494M43 631H494M43 678H494M43 725H494"/><path d="M99 566V758M180 566V758M261 566V758M342 566V758M423 566V758"/></g>
    <path d="M43 691 C93 687 123 626 168 642 C220 660 246 589 302 612 C353 632 385 669 426 651 C456 638 475 643 494 640" fill="none" stroke="#58D6D0" stroke-width="2"/>
    <path d="M43 714 C102 708 127 707 172 710 C230 714 257 695 312 703 C366 711 417 697 494 706" fill="none" stroke="#E6B85C" stroke-width="1.5"/>
    <text x="42" y="776" font-size="12" fill="#9EADB7">pressure waveform / acoustic-energy envelope / observer A-01</text>

    <g font-size="13">
      <text x="556" y="581" fill="#9EADB7">ambient pressure</text><rect x="718" y="569" width="273" height="12" fill="#25313A"/><rect x="718" y="569" width="58" height="12" fill="#58D6D0"/><text x="1000" y="581" text-anchor="end" fill="#F2EEE6">0.8%</text>
      <text x="556" y="625" fill="#9EADB7">source state</text><rect x="718" y="613" width="273" height="12" fill="#25313A"/><rect x="718" y="613" width="173" height="12" fill="#E6B85C"/><text x="1000" y="625" text-anchor="end" fill="#F2EEE6">41.2%</text>
      <text x="556" y="669" fill="#9EADB7">interface closure</text><rect x="718" y="657" width="273" height="12" fill="#25313A"/><rect x="718" y="657" width="221" height="12" fill="#E6B85C"/><text x="1000" y="669" text-anchor="end" fill="#F2EEE6">52.7%</text>
      <text x="556" y="713" fill="#9EADB7">numerics</text><rect x="718" y="701" width="273" height="12" fill="#25313A"/><rect x="718" y="701" width="23" height="12" fill="#58D6D0"/><text x="1000" y="713" text-anchor="end" fill="#F2EEE6">0.3%</text>
      <text x="556" y="757" fill="#9EADB7">observer model</text><rect x="718" y="745" width="273" height="12" fill="#25313A"/><rect x="718" y="745" width="78" height="12" fill="#58D6D0"/><text x="1000" y="757" text-anchor="end" fill="#F2EEE6">5.0%</text>
    </g>

    <g font-size="14">
      <circle cx="1090" cy="590" r="11" fill="none" stroke="#58D6D0" stroke-width="2"/><text x="1115" y="595" fill="#F2EEE6">MASS</text><text x="1545" y="595" text-anchor="end" fill="#58D6D0">PASS  1.2e-10 kg</text>
      <path d="M1078 645L1100 633L1100 657Z" fill="none" stroke="#58D6D0" stroke-width="2"/><text x="1115" y="650" fill="#F2EEE6">MOMENTUM</text><text x="1545" y="650" text-anchor="end" fill="#58D6D0">PASS  3.4e-9 N s</text>
