name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, lint, fuzz, race, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install documentation tooling
        run: npm ci --ignore-scripts

      - name: Audit documentation tooling
        run: npm audit --audit-level=high

      - name: Verify dependency and license policy
        shell: pwsh
        run: ./scripts/check-dependencies.ps1

      - name: Lint Markdown
        run: npm run lint:markdown

      - name: Verify local documentation links
        shell: pwsh
        run: ./scripts/check-links.ps1

      - name: Verify documentation media
        shell: pwsh
        run: ./scripts/check-media.ps1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify modules
        run: go mod verify

      - name: Build executable
        run: go build ./...

      - name: Verify registered schema evidence
        shell: bash
        run: |
          go test ./internal/lawcatalog -run '^TestBuiltInCatalog$'
          go test . -run '^TestLawCLITextAndJSONFixtures$'
          go test ./internal/scenarioprobe -run '^TestAtemporalProbeHasNoAmbientOrEarthRequirements$'
          go test . -run '^TestScenarioCLITextAndJSONFixtures$'
          go test . -run '^TestHelpRoutes$'

      - name: Check formatting
        shell: bash
        run: |
          mapfile -t go_files < <(git ls-files '*.go')
          if ((${#go_files[@]} == 0)); then
            exit 0
          fi
          files="$(gofmt -l "${go_files[@]}")"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: Vulnerability analysis
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Fuzz command input
        shell: bash
        run: |
          go test -run=^$ -fuzz=FuzzRun -fuzztime=5s .
          go test -run=^$ -fuzz=FuzzValidate -fuzztime=5s ./internal/scenarioprobe

      - name: Repeat tests in shuffled order
        run: go test -shuffle=on -count=20 ./...

      - name: Test with race detector and coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Enforce aggregate and per-package coverage
        shell: pwsh
        run: >-
          ./scripts/check-go-coverage.ps1
          -ProfilePath coverage.out
          -AggregateMinimum 90
          -PackageMinimum 80

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build executable
        run: go build ./...

      - name: Test
        run: go test ./...
