[graph]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"
ignore = []

[licenses]
allow = ["Apache-2.0", "MIT"]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
allow-workspace = true
allow = [
    "serde",
    "serde_core",
    "serde_json",
    "itoa",
    "memchr",
    "zmij",
    "serde_json_canonicalizer",
    "ryu-js",
    "sha2",
    "cfg-if",
    "cpufeatures",
    "digest",
    "block-buffer",
    "crypto-common",
    "hybrid-array",
    "typenum",
    "libc",
]

[[bans.features]]
crate = "serde"
allow = ["default", "std"]
exact = true

[[bans.features]]
crate = "serde_core"
allow = ["std", "result"]
exact = true

[[bans.features]]
crate = "serde_json"
allow = ["default", "std", "float_roundtrip"]
exact = true

[[bans.features]]
crate = "sha2"
allow = []
exact = true

[[bans.features]]
crate = "serde_json_canonicalizer"
allow = []
exact = true

[[bans.features]]
crate = "ryu-js"
allow = []
exact = true

[[bans.features]]
crate = "digest"
allow = ["default", "block-api"]
exact = true

[[bans.features]]
crate = "crypto-common"
allow = []
exact = true

[[bans.features]]
crate = "block-buffer"
allow = []
exact = true

[[bans.features]]
crate = "hybrid-array"
allow = []
exact = true

[[bans.features]]
crate = "typenum"
allow = ["const-generics"]
exact = true

[[bans.features]]
crate = "cpufeatures"
allow = []
exact = true

[[bans.features]]
crate = "cfg-if"
allow = []
exact = true

[[bans.features]]
crate = "libc"
allow = []
exact = true

[bans.build]
allow-build-scripts = ["serde", "serde_core", "serde_json", "zmij", "libc"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
