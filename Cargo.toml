[workspace]
members = ["crates/fart-domain", "crates/fart-core", "crates/fart-services", "crates/fart-cli"]
resolver = "3"

[workspace.package]
version = "0.8.0-alpha.1"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
repository = "https://github.com/blisspixel/fartapp"
publish = false

[workspace.dependencies]
fart-domain = { path = "crates/fart-domain" }
fart-core = { path = "crates/fart-core" }
fart-services = { path = "crates/fart-services" }
serde = { version = "=1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std", "float_roundtrip"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
